<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LaTeX Editor</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2f6f4f" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <button class="sidebar-toggle" id="sidebar-toggle" aria-pressed="true" aria-controls="files" title="Hide the file tree">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
          <rect x="1.5" y="2.5" width="13" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/>
          <rect class="sidebar-pane" x="2.2" y="3.2" width="4" height="9.6" rx="1" fill="currentColor"/>
          <line x1="6.5" y1="2.5" x2="6.5" y2="13.5" stroke="currentColor" stroke-width="1.3"/>
        </svg>
      </button>
      <button class="project-name" id="project-name" title="Switch project (⌘O / Ctrl+O)">…</button>
      <label class="main-select">Main <select id="main-select"></select></label>
      <button id="compile-btn" class="primary" title="Save all and compile (⌘S / Ctrl+S)">Compile</button>
      <label class="compare-select" title="Show what changed since a git commit">Compare with
        <select id="compare-select"><option value="">—</option></select>
      </label>
      <span class="status" id="status"></span>
      <div class="mode-toggle layout-toggle" id="layout-toggle" role="group" aria-label="Layout">
        <button data-layout="editor" aria-pressed="false" title="Editor only">Editor</button>
        <button data-layout="both" aria-pressed="true" title="Editor and PDF side by side">Both</button>
        <button data-layout="pdf" aria-pressed="false" title="PDF only">PDF</button>
      </div>
      <button class="zen-btn" id="zen-btn" title="Zen mode: hide everything but the text (Esc to exit)">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/>
        </svg>
        Zen
      </button>
      <button class="settings-btn" id="settings-btn" aria-expanded="false" aria-controls="settings" title="Settings">⚙</button>
      <div class="settings-popover" id="settings" role="dialog" aria-label="Settings" hidden>
        <div class="settings-title">Settings</div>
        <section class="setting">
          <div class="setting-row">
            <label for="set-width">Text width (visual mode)</label>
            <span class="setting-value" id="set-width-value"></span>
          </div>
          <input type="range" id="set-width" min="28" max="100" step="2" />
          <div class="setting-presets" id="set-width-presets">
            <button data-width="36">Narrow</button>
            <button data-width="44">Default</button>
            <button data-width="60">Wide</button>
            <button data-width="0">Full width</button>
          </div>
          <p class="setting-hint">How wide paragraphs are in visual mode. Source mode and the PDF aren't affected.</p>
        </section>
      </div>
    </header>

    <div class="banner" id="switched-banner" hidden>
      <span id="switched-text"></span>
      <button id="switched-reload">Reload</button>
    </div>

    <dialog class="project-dialog" id="project-dialog" aria-labelledby="project-dialog-title">
      <div class="pd-header">
        <h2 id="project-dialog-title">Open project</h2>
        <button class="link" id="pd-close" aria-label="Close">✕</button>
      </div>
      <section class="pd-section">
        <h3>Recent</h3>
        <ul class="pd-recent" id="pd-recent"></ul>
      </section>
      <section class="pd-section">
        <h3>Open folder</h3>
        <form class="pd-path" id="pd-path-form">
          <input id="pd-path" type="text" spellcheck="false" autocomplete="off" aria-label="Folder path" />
          <button type="submit">Go</button>
          <button type="button" id="pd-up" title="Parent folder">↑</button>
          <button type="button" id="pd-home" title="Home folder">~</button>
        </form>
        <ul class="pd-dirs" id="pd-dirs"></ul>
        <div class="pd-footer">
          <span class="pd-note" id="pd-note"></span>
          <button class="primary" id="pd-open">Open this folder</button>
        </div>
      </section>
    </dialog>

    <div class="banner" id="conflict" hidden>
      <span id="conflict-text"></span>
      <button id="conflict-reload">Reload from disk</button>
      <button id="conflict-overwrite">Keep my version</button>
    </div>

    <main class="layout" id="layout">
      <nav class="files" id="files" aria-label="Project files"></nav>

      <section class="editor-pane">
        <div class="pane-header">
          <span id="current-file">No file open</span>
          <span class="spacer"></span>
          <button id="track-toggle" class="track-toggle" aria-pressed="false" title="Record edits as tracked changes">
            <span class="switch" aria-hidden="true"></span>Track changes
          </button>
          <button id="comment-btn" title="Comment on the selection (⌘⌥M / Ctrl+Alt+M)">Comment</button>
          <button id="review-toggle" aria-pressed="false" title="Show all changes and comments in this file">
            Review <span class="badge" id="review-count" hidden></span>
          </button>
          <div class="mode-toggle" id="mode-toggle" role="group" aria-label="Editor mode">
            <button data-mode="visual" aria-pressed="true">Visual</button>
            <button data-mode="source" aria-pressed="false">Source</button>
          </div>
        </div>
        <div class="compare-banner" id="compare-banner" hidden>
          <span id="compare-text"></span>
          <button class="link" id="compare-exit">Stop comparing</button>
        </div>
        <div class="editor-row">
          <div class="editor" id="editor"></div>
          <aside class="review" id="review" hidden aria-label="Changes and comments"></aside>
        </div>
        <div class="problems" id="problems" hidden>
          <div class="pane-header">
            <button class="link problems-summary" id="problems-summary" title="Show or hide the list"></button>
            <button class="link" id="log-toggle">Raw log</button>
            <span class="spacer"></span>
            <button class="link" id="problems-toggle" aria-expanded="true" title="Hide the problems list">▾ Hide</button>
          </div>
          <ul id="problems-list"></ul>
          <pre id="raw-log" hidden></pre>
        </div>
      </section>

      <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" title="Drag to resize"></div>

      <section class="pdf-pane">
        <div class="pane-header">
          <span id="pdf-title">PDF</span>
          <button id="find-in-pdf" title="Show the cursor position in the PDF (⌘⌥J / Ctrl+Alt+J). Double-click the PDF to jump back.">Find in PDF</button>
          <span class="spacer"></span>
          <button id="zoom-out" title="Zoom out">−</button>
          <button id="zoom-fit" title="Fit width">Fit</button>
          <button id="zoom-in" title="Zoom in">+</button>
        </div>
        <div class="pdf" id="pdf"></div>
      </section>
    </main>

    <button class="zen-exit" id="zen-exit" hidden title="Exit Zen mode (Esc)">Exit Zen</button>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
